; =====================================================
; waves.ini - 关卡出怪配置文件
; 直接修改此文件即可改变各关卡出怪，无需重新编译
; =====================================================
;
; ==== 如何导出原版出怪数据 ====
; 1. 在 pvzdll.dll 同目录下创建一个空文件 waves_export.flag
; 2. 正常启动游戏, 进入你想导出的关卡
; 3. 游戏会自动将当前关卡的出怪数据追加写入 waves_exported.ini
; 4. 导出完成后删除 waves_export.flag 恢复配置模式
; 5. 将 waves_exported.ini 中的数据复制到本文件即可
;
; ==== 关卡标识规则 ====
; 冒险模式: [Adventure:N]   N=关卡编号(1=1-1,2=1-2,...,50=5-10)
; 冒险二周目: [Adventure2:N] 仅二周目生效, 未定义时回退到 [Adventure:N]
; 其它模式: 使用PVZLevel枚举名, 如 [Survival_Day_Endless]
;           完整列表见 PVZLevelEnum.h
;
; ==== 僵尸英文名 ====
; Zombie(普僵)     FlagZombie(旗帜)    ConeheadZombie(路障)
; PoleVaultingZombie(撑杆)   BucketheadZombie(铁桶)
; NewspaperZombie(读报)      ScreenDoorZombie(铁门)
; FootballZombie(橄榄球)     DancingZombie(舞王)
; BackupDancer(伴舞)         DuckyTubeZombie(鸭子)
; SnorkedZombie(潜水)        Zomboin(冰车)
; ZombieBobsledTeam(雪橇)    DolphinRiderZombie(海豚)
; JackintheboxZombie(玩偶匣)  BalloonZombie(气球)
; DiggerZombie(矿工)         PogoZombie(跳跳)
; ZombieYeti(雪人)           BungeeZombie(蹦极)
; LadderZombie(扶梯)         CatapultZombie(投石车)
; Gargantuar(巨人)           Imp(小鬼)
; DrZomboss(僵王博士)        Gigagargantuar(红眼巨人)
; PoleCommander(撑杆司令,自定义) 血1000移速1.5倍可跳两次,数值见 zombie_mechanics.ini
; BlastproofDoorZombie(防爆门,自定义) 铁门+铁桶双防具,铁门存在时任何伤害限伤200,
;   只有小推车能直接击杀,防具血量见 zombie_mechanics.ini [BlastproofDoorZombie] 节
;
; ==== 规则 ====
; - 未列出的关卡/波次使用游戏默认值
; - WaveCount 未设则用游戏默认旗帜数
; - 每波最多50个槽位
; - 英文名大小写敏感，必须与上面列表完全一致
; =====================================================


; ---------- 冒险模式 1-1 ----------
[Adventure:1]
WaveCount = 3
Wave0 = Zombie, Zombie, Zombie
Wave1 = Zombie, Zombie, Zombie, ConeheadZombie
Wave2 = FlagZombie, Zombie, Zombie, ConeheadZombie, ConeheadZombie

; ---------- 冒险模式 1-1 二周目 ----------
; [Adventure2:1]          ; 二周目专用, 找不到则回退到 [Adventure:1]
; WaveCount = 5            ; 二周目增加波数
; Wave0 = Zombie, ConeheadZombie, ConeheadZombie
; Wave1 = FlagZombie, Zombie, ConeheadZombie, PoleVaultingZombie
; Wave2 = Zombie, ConeheadZombie, ConeheadZombie, BucketheadZombie
; Wave3 = FlagZombie, ConeheadZombie, BucketheadZombie, FootballZombie
; Wave4 = FlagZombie, Gargantuar, Gargantuar, Imp, Imp

; ---------- 冒险模式 1-2 ----------
[Adventure:2]
WaveCount = 5
Wave0 = Zombie, Zombie, Zombie
Wave1 = Zombie, Zombie, ConeheadZombie, ConeheadZombie
Wave2 = FlagZombie, Zombie, Zombie, ConeheadZombie, ConeheadZombie
Wave3 = Zombie, Zombie, ConeheadZombie, PoleVaultingZombie
Wave4 = FlagZombie, ConeheadZombie, ConeheadZombie, BucketheadZombie, PoleCommander
; 想调整撑杆司令出怪? 把其他波的 PoleVaultingZombie 改成 PoleCommander 即可
; 例如: Wave3 = Zombie, Zombie, ConeheadZombie, PoleCommander
; 防爆门僵尸示例: 把铁门僵尸(ScreenDoorZombie)改成 BlastproofDoorZombie
; 例如: Wave4 = FlagZombie, ConeheadZombie, ConeheadZombie, BlastproofDoorZombie


; ===== 下面是你需要自行填入的关卡 =====
; 删除行首的 ; 即可启用

; [Adventure:3]
; WaveCount = 6
; Wave0 = Zombie, Zombie, Zombie
; ...

; [Adventure:4]
; WaveCount = 6
; ...

