; ==========================================
;  植物特殊机制配置 - Plant Mechanics
; ==========================================
;
; 豌豆射手 3阶+ 击退子弹
;   - 概率触发，子弹带击退效果
;   - 子弹速度为普通子弹的 1.5 倍（硬编码）
;
KNOCKBACK_PROBABILITY=25  ; 触发概率 (%)
KNOCKBACK_DISTANCE=20     ; 单体击退距离 (px)

;
; 豌豆射手 5阶 连射
;   - 概率触发，连射两发
;
DOUBLE_SHOT_PROBABILITY=30  ; 触发概率 (%)

;
; 向日葵 3阶+ 光环
;   - 左边1格和右边1格植物攻速增加
;
SUNFLOWER_AURA_SPEED_BOOST=30  ; 相邻植物攻速提升百分比 (%)

;
; 寒冰射手 3/4阶 冻结
;   - 子弹概率冻结僵尸2s（寒冰菇同款冻结效果）
;
SNOWPEA_FREEZE_PROBABILITY=10  ; 触发概率 (%)

;
; 寒冰射手 5阶 冰锥
;   - 取消三/四阶机制，改为概率射出冰锥
;   - 冰锥速度1.5倍、伤害40、穿透、无视二类防具
;   - 未减速僵尸→减速，已减速僵尸→冻结2s
;
SNOWPEA_ICICLE_PROBABILITY=10  ; 触发概率 (%)

;
; 双发射手 2阶 冰豌豆
;   - 概率射出冰豌豆（寒冰射手同款子弹）
;
REPEATER_ICE_PEA_PROBABILITY=20  ; 触发概率 (%)

;
; 双发射手 3阶 火豌豆
;   - 保留2阶机制
;   - 概率射出火豌豆（火炬树桩同款火球）
;
REPEATER_FIRE_PEA_PROBABILITY=20  ; 触发概率 (%)

;
; 双发射手 5阶 冰火豌豆
;   - 保留2阶、3阶机制
;   - 概率射出冰火豌豆：火豌豆伤害/溅射 + 直接命中减速10s
;   - 直接命中僵尸若处于冻结状态，消除冻结后附减速
;   - 贴图暂用火豌豆
;
REPEATER_ICE_FIRE_PEA_PROBABILITY=20  ; 触发概率 (%)

;
; 胆小菇 渐变攻速
;   - 每发射击缩短间隔，每秒不攻击延长间隔
;   - 3阶初始攻速1.5s，5阶最快攻速时免疫缩头
;
SCAREDY_SPEED_DOWN=30  ; 每发缩短间隔 (ms)
SCAREDY_SPEED_UP=20    ; 每秒延长间隔 (ms)

;
; 三叶草 (灰烬植物，种下前摇结束原版吹飞飞行僵尸，此处追加等阶效果)
;   - 1阶: 全屏僵尸减速10s
;   - 2阶: 全屏僵尸击退(向后退)
;   - 3阶: 全屏植物攻速提升(冷却缩减)，持续5s，不含卡槽冷却
;   - 各阶效果叠加(高阶含低阶)
;   - 等阶经验来源: 前摇期间铲同行其他植物，其经验转移给三叶草
;
BLOVER_KNOCKBACK_DISTANCE=40       ; 2阶击退距离 (px)
BLOVER_SPEED_BOOST_REDUCTION=33    ; 3阶冷却缩减比例 (%)
BLOVER_SPEED_BOOST_DURATION=500    ; 3阶增益持续时间 (厘秒, 500=5秒)

;
; 经验包（肥料按钮）
;   - 关卡内屏幕右上角、主菜单按钮下方
;   - 点击选中后点击植物，花费阳光给植物加经验
;   - 使用后进入冷却（冷却期间按钮变暗不可用）
;
EXP_POUCH_SUN_COST=300     ; 阳光花费
EXP_POUCH_EXP_GAIN=300     ; 单次给植物的经验值
EXP_POUCH_COOLDOWN=750     ; 冷却时长 (厘秒, 750=7.5秒)

;
; === 杨桃（Starfruit, SeedType=29）弹射机制（全代码实现，无额外配置项）===
;   - 3阶起生效（0-2阶保持原版5星，无弹射）
;   - 3阶: 命中后弹射1次
;       正上 -> 右下45   正下 -> 右上45   后方 -> 正前
;       右上60 -> 右下60   右下60 -> 右上60
;   - 4阶: 45°子弹可弹射2次（右下45 <-> 右上45 交替翻转；60°方向仍只弹1次）
;   - 5阶: 每5次攻击触发一次暴击，齐射扩展为8星（正上/正下/正前/正后/
;       右上45/右下45/左上45/左下45，八向全部45°倾斜），
;       全部可弹射2次（左上45 -> 右上45 -> 右下45；左下45 -> 右下45 -> 右上45）
;   - 每发子弹记录已命中僵尸，不二次攻击同一僵尸
;   - 伤害20（与原版一致），由代码常量 STARFRUIT_DAMAGE 控制


;
; === 金盏花（Marigold, SeedType=38）形态产出物机制 ===
;   - 咖啡豆唤醒解锁等阶（同保护伞），3阶满阶
;   - 形态由右键轮换（0白/1蓝/2黄/3绿，受等阶上限约束），切换播放特效46
;   - 形态决定产出物：白=肥料包(+300经验) 蓝=水壶(+300血) 黄=留声机(攻速加成) 绿=杀虫剂(格子每秒50真伤)
MG_WATER_HEAL=300          ; 水壶回血量
MG_BOOST_PERCENT=40        ; 留声机攻速加成百分比（40=提速1.67倍）
MG_BOOST_DURATION=800      ; 留声机持续（厘秒, 800=8秒）
MG_SPRAY_DPS=50            ; 杀虫剂每秒伤害（真伤, 无视护甲）
MG_SPRAY_DURATION=500      ; 杀虫剂持续（厘秒, 500=5秒）
MG_ITEM_MAX=3              ; 每株金盏花最多产出物（满则顶掉最旧）
MG_PRODUCE_INTERVAL_CS=0   ; 金盏花产出间隔（厘秒, 0=原版约24秒）

;
; === 玉米投手（KernelPult, SeedType=34）机制（3阶满阶）===
;   - 0阶: 同原版（黄油概率 25%）
;   - 1阶: 对某一个僵尸每攻击一次，黄油概率 +5%，最高 50%（每个僵尸独立累加）
;   - 2阶: 索敌僵尸越近攻速越快，4格→1格攻击间隔线性缩短至 1s
;   - 3阶: 每次投掷有 0.5% 概率扔出大玉米炮（玉米加农炮弹，落地爆炸）
CORNPULT_BUTTER_BASE=25      ; 1阶黄油基础概率 (%)
CORNPULT_BUTTER_UP=5         ; 1阶每攻击一次概率提升 (%)
CORNPULT_BUTTER_MAX=50       ; 1阶概率上限 (%)
CORNPULT_FAST_INTERVAL=1.0   ; 2阶最近距(1格)攻击间隔 (秒)
CORNPULT_COB_PROBABILITY=0.5 ; 3阶大玉米炮触发概率 (%)

;
; === 海蘑菇（SeaShroom, SeedType=24）剧毒机制 ===
;   - 0阶: 每发子弹附加 1 层剧毒（直伤 10 为原版值，硬编码不导出）
;   - 1阶: 每发子弹附加 2 层剧毒
;   - 3阶: 每发子弹附加 3 层剧毒（4/5阶同3阶层数）
;   - 剧毒每秒造成"剧毒层数"点伤害（硬编码），优先伤害防具
;     （走正常伤害流程，先头盔后盾牌再本体）
;   - 携带剧毒的僵尸变绿（乘法染色，硬编码）
;   - 剧毒为永久状态（无时限），层数只增不减；毒系植物共用同一套标记
;   - 5阶: 层数≥阈值时再被海蘑菇子弹命中触发"毒爆"：
;       15倍层数直伤 + 3×3范围僵尸附加 10 层毒（均硬编码）
;       触发后层数不重置（每次命中都爆）
;
SEASHROOM_POISON_STACK_T0=1   ; 0阶每发子弹附加层数
SEASHROOM_POISON_STACK_T1=2   ; 1阶每发子弹附加层数
SEASHROOM_POISON_STACK_T3=3   ; 3阶每发子弹附加层数
SEASHROOM_POISON_BURST_STACKS=40 ; 5阶毒爆触发阈值（层数）

; （外观数值已固化：剧毒染色与毒爆粒子参数硬编码在 pch.cpp，2026-09-13 起不再外置）

; ============================================================
; === 大喷菇（Fumeshroom, SeedType=10）等阶机制 ===
;   - 0阶: 同原版
;   - 1/2/4阶: 纯攻速（数值见 plant_attack_speed.ini 的 10= 行）
;   - 3阶: 攻击范围（索敌+伤害矩形）向前延伸 2 格 = 160px；
;          粒子动画同步变长：**只对该株生效**——DLL 复制一份加长的 FumeCloud 定义，
;          3 阶开火时用它创建、创建完立刻切回原版 ⇒ 0-2 阶逐帧与原版完全一致
;   - 5阶: 每次攻击命中时把僵尸向后推 FUME_KB_DISTANCE 像素，
;          位移在 FUME_KB_FRAMES 帧内平滑叠加（外观 = 短时间叠加一个向右的速度）；
;          处于"抬手要砸"状态（GARGANTUAR_SMASH=0x46）的巨人僵尸免疫
;   - ★ 与究极大喷菇（ULF）互斥：ULF_ENABLED=1 时等阶机制整体停用
; ============================================================
;
FUME_ENABLED=1            ; 总开关（0=整段停用，大喷菇回到原版行为）
FUME_T3_RANGE_EXTEND=160  ; 3阶攻击矩形宽度增量（px，160=2格；原版宽 340 → 500）
FUME_T3_PUFF_DX=160       ; 3阶时雾的扫程增量（px，单段雾整体加长；0=不加长）
FUME_KB_DISTANCE=10       ; 5阶每次攻击的击退距离（px）
FUME_KB_FRAMES=15         ; 5阶击退平滑分摊帧数（15 帧 ≈ 0.25 秒）
FUME_DEBUG=1 ; 1=每 100 帧往 D:\pvz_fume_debug.txt 覆盖写一行自检（排障用）

;
; ============================================================
; === 究极大喷菇（UltFume，由大喷菇 SeedType=10 改造，独立于等阶系统）===
;   - 攻击范围：全行（原版只有身前约 3.5 格）
;   - 每 0.5 秒对全行所有僵尸：100 伤害 + 减速 + 累计 10 点冻结值
;   - 冻结值满上限 → 寒冰菇式冻结 → 清零 → 上限 +100（最高 400）
;   - 僵尸生命值 < 50% 时，每次攻击 1% 概率魅惑；成功则在该位置 3×3 爆炸（360 伤害）
;   - 总开关 ULF_ENABLED=0 可一键恢复原版大喷菇（A/B 排查用）
;   - ★★ 2026-10-20：ULF_ENABLED 默认改为 0（等阶版大喷菇接管）。
;        置 1 会与上面的等阶机制冲突（两套系统各自结算伤害并抢 [plant+0x58] 节奏），
;        代码里做了互斥：ULF=1 时等阶机制整体跳过。
; ============================================================
;
ULF_ENABLED=0             ; 总开关（0=原版大喷菇行为，等阶机制生效）
ULF_INTERVAL_CS=50        ; 攻击间隔（厘秒，100 厘秒 = 1 秒；50 = 0.5 秒）
ULF_DAMAGE=100            ; 每次攻击对每只僵尸造成的伤害
ULF_SLOW_CS=200           ; 减速持续时长（厘秒，200 = 2 秒）
ULF_FREEZE_GAIN=10        ; 每次攻击累计的冻结值
ULF_FREEZE_CAP_BASE=100   ; 冻结值初始上限
ULF_FREEZE_CAP_STEP=100   ; 每次冻结后上限增量
ULF_FREEZE_CAP_MAX=400    ; 冻结值上限的最大值
ULF_FREEZE_CS=400         ; 冻结持续时长（厘秒，400 = 4 秒，寒冰菇同款）
ULF_CHARM_PERCENT=1       ; 低血魅惑概率（%，每只僵尸每次攻击独立判定）
ULF_CHARM_HP_PERCENT=50   ; 生命值低于最大生命的该百分比才可能魅惑
ULF_CHARM_TOTAL_HP=1      ; 1=按总体生命(护甲+本体)判定  0=仅按本体生命判定
ULF_BOOM_DAMAGE=360       ; 魅惑成功后 3×3 爆炸伤害
ULF_BOOM_ROW_RANGE=1      ; 爆炸行半径（±N 行，1 = 共 3 行）
ULF_BOOM_X_RANGE=120      ; 爆炸 X 半径（px，120 ≈ 3 格宽的一半）
ULF_BOOM_SOUND=0          ; 爆炸音效 ID（0=不播；需自行试出合适的 ID）
ULF_FRONT_ONLY=0          ; 1=只打植物右侧（X >= 植物 X），0=全行都打

; 自检开关：1=每秒往 D:/pvz_ulf_debug.txt 覆盖写一行运行自检
;   （hook 装配状态 / 轮询帧数 / 大喷菇株数 / 触发数 / 开火数 / 命中数 / 异常数）
;   排障用完改回 0。注意：build.bat 只在游戏目录 ini 不存在时才拷贝，
;   新增键需要手动同步到 PlantsVsZombies_CN\plant_mechanics.ini
ULF_DEBUG=1

; ===== 大嘴花（Chomper, SeedType=6）机制 =====
;   - 0阶同原版；每次消化完成回复自身 100 血（各阶均生效）
;   - 1阶 血量上限→600；2阶 消化时间→33s；3阶 血量上限→1000；4阶 消化时间→23s
;     （血量/消化时间由 plant_tier.ini + plant_attack_speed.ini 决定）
;   - 5阶 对"无法吞咽的僵尸"(巨人/防爆门) 撕咬造成百分比伤害（护甲+本体10%，优先打护甲）
;     伤害优先级低于防爆门限伤(200)：最终撕咬伤害 = clamp(10%伤害, 保底40, 200)
;     保底40 与 回血100 为代码常量（改动需改 pch.cpp 的 g_chomberBiteMinDamage/g_chomberDigestHeal）
CHOMPER_BITE_PERCENT=10    ; 5阶撕咬百分比伤害 (%)

; Watermelon upgrade-direction chooser UI layout (optional, defaults in code)


;
; === 西瓜投手（Melonpult, SeedType=39）机制（3阶+，需先右键选择"西瓜路线"解锁）===
;   - 3阶: 42% 概率两连投（下一帧原生补发第二发）
;   - 4阶: 连投的每一发继续判定连投概率，单轮最多 5 连
;   - 5阶: 每一轮投掷的最后一发变为西瓜大炮（S4 同机制）：
;       真落地触发（弹体不与僵尸碰撞、飞过头顶自由下落，视觉高度追上影子即爆），
;       单层樱桃爆炸特效，贴图替换为西瓜泼溅大图并整体放大 150%，
;       本行落点前后 1.375 格 220 点无衰减群伤（伤害可配），邻行前后 0.5 格 40 点（硬编码）
;   - 连投与大炮兼容：大炮永远是本轮最后一发（连几发由前面各发的概率决定）
;
MELON_CHAIN_PROBABILITY=42   ; 连投概率 (%)，3阶两连投、4阶起可继续连投（最多5连）
MELON_CANNON_DAMAGE=220      ; 5阶西瓜大炮本行群伤（邻行固定 40，代码常量不导出）

;
; === 冰西瓜（WinterMelon, SeedType=44）机制（0~3阶无新机制）===
;   - 由西瓜投手（3阶卡点）右键选"方案二 冰瓜路线"替换而来，保留等阶与经验
;   - 4阶: 冰瓜命中僵尸时 ICE_MELON_FREEZE_PROBABILITY% 概率冻结 4 秒（寒冰菇同款冻结）
;         （冻结时长 400 厘秒为代码常量，不导出）
;   - 5阶: 每 5 次普攻触发一次"冰瓜大招"：
;         本行按 X 排序的第 1 只僵尸吃一发普通冰瓜（原版伤害/减速，走原生结算），
;         第 2 ~ (1+ICE_MELON_VOLLEY_COUNT) 只僵尸各散射一枚"小冰瓜"
;         （伤害 10 + 减速为代码常量不导出；贴图 80% = images\ProjectileIceMelonSmall.png）
;         每 5 次普攻为大招触发周期（代码常量，不导出）
;   - 大招弹均为有来源伤害，击杀经验归冰西瓜
;
ICE_MELON_FREEZE_PROBABILITY=20  ; 4阶命中冻结概率 (%)
ICE_MELON_VOLLEY_COUNT=14        ; 5阶大招散射小冰瓜数量 (枚，不含第1只的普通冰瓜)

;
; === 寒冰菇（IceShroom, SeedType=14）机制（3阶满阶，同樱桃/辣椒）===
;   - 0阶: 同原版（冻结全屏僵尸 4 秒）
;   - 1阶: 冻结瞬间造成 80 点伤害（不导出，代码常量 ICE_T1_DAMAGE）
;   - 2阶: 冻结时间延长为 8 秒
;   - 3阶: 冻结后以寒冰菇为中心留下 3×3 冰法阵（持续 20 秒），
;       走进的僵尸减速并带脆弱（受到的所有伤害提高 20% 结算）
;   - 冰法阵用路灯花灯光特效（数值表"2E 光：辉耀1"LanternShine）染蓝标注，
;       中心=寒冰菇所在格中心
;
ICESHROOM_FREEZE_CS=800          ; 2/3阶冻结时长（厘秒，800=8秒）
ICESHROOM_FIELD_DURATION=2000    ; 3阶冰法阵持续（厘秒，2000=20秒）
ICESHROOM_VULNERABLE_PERCENT=20  ; 3阶被法阵内僵尸受到的额外增伤（%，20=+20%）

;
; === 毁灭菇（Doomshroom, SeedType=15）机制（等阶阈值见 plant_tier.ini 15= 行）===
;   - 0阶: 同原版
;   - 1阶: 爆炸范围扩大到半径 350 像素，范围内僵尸全部化灰死亡（原版灰烬路径）
;   - 2阶: 爆炸范围扩大到全屏
;   - 3阶: 爆炸后原地留下 3×3 毁灭领域，领域内僵尸受到的伤害无视一类、二类防具，
;       直接结算本体（防爆门僵尸的限伤代码优先级更高，领域穿甲对它无效）；
;       领域消失/僵尸离开领域时穿甲效果消失
;   - 4/5阶: 机制与 3阶 相同（规格暂未定义独立机制）
;   - 领域持续时长与寒冰菇 3阶冰法阵共用同一个参数（ICESHROOM_FIELD_DURATION），
;       无独立配置项
;   - 领域视觉 = 紫雾贴图层 + 领域内受伤紫焰（外观已固化：雾贴图由 make_doomfog_area.py 生成，
;       染色/位置参数硬编码在 pch.cpp，2026-09-13 起不再外置）
;

;
; === 高坚果（Tallnut, SeedType=23）机制（3阶满阶，阈值见 plant_tier.ini 23= 行）===
;   - 0阶: 血量上限 4000（代码常量 TALLNUT_T0_MAXHP）
;   - 1阶: 血量上限提升至 TALLNUT_T1_MAXHP 并回满血（2/3阶上限不再提升）
;   - 2阶: 抗秒杀——巨人锤击 / 车类（冰车、投石车）碾压 / 辣椒僵尸爆炸
;       改为扣除 TALLNUT_ANTIKILL_DAMAGE 点血量（扣后仍存活，血量撑不住这一次时
;       按原版压扁/烧毁）；车类碾压被挡下时，该车类被击退 1 格（80px，代码常量）
;   - 3阶: 每累计受到 2000 点伤害（代码常量 TALLNUT_T3_DMG_STEP，含2阶秒杀转化的扣血），
;       将前方 1 格内最近的僵尸击退 1.5 格（120px，代码常量）
;
TALLNUT_T1_MAXHP=8000        ; 1阶起血量上限
TALLNUT_ANTIKILL_DAMAGE=1000 ; 2阶每次"秒杀"转化的扣血量

; === 豌豆射手 5 阶骑士皮肤总开关（排障用）===
;   1 = 启用（默认，不写这行也是 1）；0 = 整段禁用（完全不碰任何 reanim）
;   用途：排查"某个崩溃是不是这段引起的"——设 0 后重开游戏即可，无需重编 DLL
PEASHOOTER_T5_SKIN=1
; 向日葵 3 阶「皇冠+权杖」皮肤总开关（1=启用，0=整段禁用）
SUNFLOWER_3_SKIN=1

; === 磁力菇（MagnetShroom, SeedType=31）等阶机制（3阶即满阶，阈值见 plant_tier.ini 31= 行）===
;   - 经验：消化铁器完成时获得「该铁器满耐久(=MaxHealth)」的经验；
;           该僵尸最终死亡结算经验时不再计算这份被吸走的铁器（经验总量守恒）。
;           不作为防具的铁器（跳跳杆/玩偶匣/矿工镐）没有耐久 → 按 0 处理。
;   - 0阶: 同原版
;   - 1阶: 消化完成时给本行一格上一个护盾（同格多株植物共用一个，不可叠加）。
;          优先无盾格 → 都有盾时给「盾剩余耐久最低」的格重置满 → 本行盾全满则什么都不做；
;          同级优先：格内植物绝对血量最低 → 离磁力菇最近（磁力菇自己最近）→ 靠右
;   - 2阶: 吸铁半径 +90px（原版 270；僵尸正在啃食时 320 → 360/410）
;   - 3阶: 消化完成时若本行所有格护盾都满耐久 → 把铁器扔给全屏最近的敌人
;          （伤害固定，可打空中气球/水中潜水，不可打未出土矿工/未低头僵王）；
;          场上没有可索敌敌人 → 一直持有铁器，直到出现可索敌敌人才扔
;   - 护盾承伤：僵尸啃食先扣护盾；碾压/爆炸等秒杀消耗整个护盾抵挡一次（植物不死），
;               车类碾压抵挡时同时把车击退一段（复用高坚果逻辑）
;   护盾贴图 images\PlantShield.png；上盾闪光 images\PlantShield_fx{100,80,60,40,20}.png
;   （闪光 = 42-坚果圣盾.png 的 5 档预烘焙 alpha，显示后逐档淡出，总 0.4 秒）
;   ★ 两张图的绘制偏移已于 2026-10-16 实测定稿并硬编码进 DLL，不再由 ini 控制。
;   ★ MAGNET_DEBUG 自检日志已于开发完成时移除，本段只保留可调数值。
MAGNET_SHIELD_HP=300        ; 护盾耐久
MAGNET_RADIUS_BONUS=90      ; 2阶吸铁半径加成（像素）
MAGNET_THROW_DAMAGE=300     ; 3阶扔铁器伤害
MAGNET_THROW_MS=350         ; 3阶铁器飞行总时长（毫秒，上限 350）
MAGNET_LADDER_HP=500        ; 架在草坪上的梯子被吸走时给的耐久（原版 500）

; === 墓碑吞噬者（GraveBuster, SeedType=11）等阶机制（3阶即满阶，阈值见 plant_tier.ini 11= 行）===
;   - 0阶: 吞噬墓碑完成 → 原地"跳出"一个经验包（单击拾起 → 拖到植物上 +经验）
;   - 1阶: 每次吞噬成功 → 该植物卡剩余冷却减半
;   - 2阶: 吞噬完成 → 原地等概率生成 普通/路障/铁桶/橄榄 僵尸
;   - 3阶: 吞噬完成 → 再"跳出"一张随机植物卡片（从本关卡槽随机，排除花盆/睡莲），
;          原版卡片掉落物：落地后点击即可直接种植（砸罐子同款）
;   - 经验来源：完全靠"队友分经验 + 肥料包/经验包"。★ 墓碑吞噬者消失时经验不给队友，
;              而是写回"卡片级永久经验"（工作目录 grave_buster_card.dat，跨关卡继承）。
;   - 模仿者墓碑吞噬者暂与普通卡共用同一份卡片经验。
;   ★ GB_DEBUG 只在排障时写 D://pvz_gb_debug.txt。
GB_EXP_PACK_GAIN=300        ; 经验包给植物加的经验值
GB_DIG_EXP=0                ; 每次吞噬成功后额外给卡片多少经验（0=关闭，纯靠肥料/队友分经验；
                            ; 实测发现墓碑吞噬者只活约4秒、肥料冷却7.5秒，喂不到高阶时可把这里调大）
GB_ITEM_LIFE_CS=1800        ; 经验包在地面存在时长（厘秒，1800=18 秒）
GB_ITEM_ANIM_SPEED=0.8      ; 经验包"跳出"动画速度倍率（1.0=原速，0.8=慢到1.25倍时长）
GB_ZOMBIE_TYPES=0,2,4,7     ; 2阶随机【魅惑】僵尸池（ZombieType：0普通 2路障 4铁桶 7橄榄）
GB_CARD_EXCLUDE=16,33       ; 3阶随机卡片排除的种子（16睡莲 33花盆；写 -1 = 不排除任何植物）
GB_DEBUG=0                  ; 1=写排障日志
