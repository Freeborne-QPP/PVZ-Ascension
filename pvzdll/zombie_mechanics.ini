; =====================================================
; zombie_mechanics.ini - 僵尸机制配置文件
; 直接修改此文件即可调整数值，无需重新编译
; =====================================================
;
; [PoleCommander] 撑杆司令
;   在 waves.ini 中使用英文名 PoleCommander 控制出场
;   （如: Wave3 = Zombie, PoleCommander, ConeheadZombie）
;   机制: 使用撑杆僵尸贴图/全部机制，血量 1000，
;         有杆时移速 = 普通撑杆僵尸 x SpeedMultiplier，
;         可以跳两次（跳过第1个植物后保留杆子继续跑，
;         再跳过第2个植物后才丢杆变成普通无杆状态）
;
[PoleCommander]
SpeedMultiplier = 1.5
Hp = 1000

; =====================================================
; [BlastproofDoorZombie] 防爆门僵尸
;   在 waves.ini 中使用英文名 BlastproofDoorZombie 控制出场
;   （如: Wave3 = Zombie, BlastproofDoorZombie, ConeheadZombie）
;   机制: 铁门僵尸 + 铁桶双防具。铁门存在时，受到的任何伤害
;         （子弹/窝瓜/土豆雷/灰烬等）限伤 MaxDamagePerHit，
;         只有小推车能无视该机制直接击杀。
;   ★ 本节的防具血量只作用于防爆门僵尸，普通铁桶/铁门僵尸
;     的数值不受影响。
;
[BlastproofDoorZombie]
DoorHp = 1100
BucketHp = 1100
BodyHp = 200
MaxDamagePerHit = 200
