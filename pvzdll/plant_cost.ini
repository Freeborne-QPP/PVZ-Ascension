; ==============================================
;  植物阳光/冷却 外部配置 - Plant Cost Config
; ==============================================
; 格式: SeedType = Cost, Cooldown
;   Cost     : 阳光花费（1=1 阳光）
;   Cooldown : 种植冷却时间（单位 厘秒，750 = 7.5 秒）
;
; 注意: 不再配置攻速！攻速由等阶系统(plant_attack_speed.ini)独立管理，
;       配置表只允许两个字段，多余的第三个字段会被忽略。
;
; 本文件默认值 = 游戏原版数值（从 exe 静态表 dump）
; 修改后需重新注入 DLL 生效；正在进行的关卡内不刷新，
; 重新选卡/进关后新数值生效。
;
; 种子类型编号对照(SeedType):
;   0=Peashooter  1=Sunflower  2=CherryBomb  3=WallNut  4=PotatoMine  5=SnowPea  6=Chomper  7=Repeater  8=PuffShroom  9=SunShroom
;   10=FumeShroom  11=GraveBuster  12=HypnoShroom  13=ScaredyShroom  14=IceShroom  15=DoomShroom  16=LilyPad  17=Squash  18=Threepeater  19=TangleKelp
;   20=Jalapeno  21=Spikeweed  22=Torchwood  23=TallNut  24=SeaShroom  25=Plantern  26=Cactus  27=Blover  28=SplitPea  29=Starfruit
;   30=Pumpkin  31=MagnetShroom  32=Cabbagepult  33=FlowerPot  34=Kernelpult  35=CoffeeBean  36=Garlic  37=UmbrellaLeaf  38=Marigold  39=Melonpult
;   40=GatlingPea  41=TwinSunflower  42=GloomShroom  43=Cattail  44=WinterMelon  45=GoldMagnet  46=Spikerock  47=CobCannon  48=Imitater  49=ExplodeONut
;   50=GiantWallnut  51=Sprout  52=LeftRepeater
; ==============================================

