; ==========================================
;  植物等阶配置文件 - Plant Tier Config
; ==========================================
; 格式: SeedType = MaxExp, T1阈值, T2阈值, T3阈值, T4阈值, T5阈值
; 
; 等阶划分规则:
;   Tier 0: [      0, T1 )  - 0阶
;   Tier 1: [     T1, T2 )  - 1阶
;   Tier 2: [     T2, T3 )  - 2阶
;   Tier 3: [     T3, T4 )  - 3阶
;   Tier 4: [     T4, T5 )  - 4阶
;   Tier 5: [     T5, Max ] - 5阶（满阶）
;
; 未单独配置的种子类型使用 DEFAULT 配置
; 种子类型编号对照: 0=Peashooter 豌豆射手, 1=Sunflower 向日葵, 
;   2=CherryBomb 樱桃炸弹, 3=WallNut 坚果墙, 4=PotatoMine 土豆雷,
;   5=SnowPea 寒冰射手, 6=Chomper 大嘴花, 7=Repeater 双发射手,
;   8=PuffShroom 小喷菇, 9=SunShroom 阳光菇, ...
; 完整列表见 SeedType.h
; ==========================================

